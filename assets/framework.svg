<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ontology-Anything framework</title>
<desc id="d">Documents and tables pass through six stages (table schema induction, enrichment, extraction, quote verification, compile validation, conflict detection) into a draft that a person reviews and approves; the approved ontology and seed data run on nano-onto, which agents use over MCP.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="1178" height="558" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="40" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">INPUTS</text>
<text x="250" y="40" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">BUILD  ·  NOTHING IS TRUSTED YET</text>
<text x="730" y="40" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">REVIEW</text>
<text x="960" y="40" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">RUN</text>
<rect x="28" y="60" width="190" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="42" y="89" font-size="15" font-weight="700" fill="#0f172a">Documents</text>
<text x="42" y="112" font-size="12.5" fill="#334155">policies, SOPs, contracts</text>
<text x="42" y="130" font-size="12.5" fill="#334155">notices and amendments</text>
<text x="42" y="148" font-size="12.5" fill="#334155">.md .txt .pdf .docx .html</text>
<text x="42" y="166" font-size="12.5" fill="#334155">.pptx and layout via Docling</text>
<rect x="28" y="330" width="190" height="132" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="42" y="359" font-size="15" font-weight="700" fill="#0f172a">Tables</text>
<text x="42" y="382" font-size="12.5" fill="#334155">exports, spreadsheets</text>
<text x="42" y="400" font-size="12.5" fill="#334155">.csv .tsv .xlsx</text>
<text x="42" y="418" font-size="12.5" fill="#334155">rows become seed data</text>
<rect x="250" y="352" width="208" height="124" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="272" cy="376" r="11" fill="#16a34a"/><text x="272" y="380.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="290" y="381" font-size="15" font-weight="700" fill="#0f172a">Tables</text>
<text x="264" y="404" font-size="12.5" fill="#334155">types, keys, ID prefixes,</text>
<text x="264" y="422" font-size="12.5" fill="#334155">enums, foreign keys → links</text>
<text x="264" y="440" font-size="12.5" fill="#334155">deterministic</text>
<rect x="250" y="60" width="208" height="124" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<circle cx="272" cy="84" r="11" fill="#d97706"/><text x="272" y="88.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="290" y="89" font-size="15" font-weight="700" fill="#0f172a">Enrich</text>
<text x="264" y="112" font-size="12.5" fill="#334155">labels, roles, object types</text>
<text x="264" y="130" font-size="12.5" fill="#334155">the tables do not cover</text>
<text x="264" y="148" font-size="12.5" fill="#334155">LLM</text>
<rect x="250" y="206" width="208" height="124" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<circle cx="272" cy="230" r="11" fill="#d97706"/><text x="272" y="234.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="290" y="235" font-size="15" font-weight="700" fill="#0f172a">Extract</text>
<text x="264" y="258" font-size="12.5" fill="#334155">actions, rules and facts,</text>
<text x="264" y="276" font-size="12.5" fill="#334155">each with a verbatim quote</text>
<text x="264" y="294" font-size="12.5" fill="#334155">LLM, per document chunk</text>
<rect x="478" y="60" width="208" height="124" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="500" cy="84" r="11" fill="#16a34a"/><text x="500" y="88.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="518" y="89" font-size="15" font-weight="700" fill="#0f172a">Verify</text>
<text x="492" y="112" font-size="12.5" fill="#334155">quote must appear verbatim</text>
<text x="492" y="130" font-size="12.5" fill="#334155">in its source document</text>
<text x="492" y="148" font-size="12.5" fill="#334155">else UNVERIFIED</text>
<rect x="478" y="206" width="208" height="124" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="500" cy="230" r="11" fill="#16a34a"/><text x="500" y="234.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="518" y="235" font-size="15" font-weight="700" fill="#0f172a">Validate</text>
<text x="492" y="258" font-size="12.5" fill="#334155">every action and rule must</text>
<text x="492" y="276" font-size="12.5" fill="#334155">compile under nano-onto</text>
<text x="492" y="294" font-size="12.5" fill="#334155">else INVALID</text>
<rect x="478" y="352" width="208" height="124" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="500" cy="376" r="11" fill="#16a34a"/><text x="500" y="380.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="518" y="381" font-size="15" font-weight="700" fill="#0f172a">Conflict</text>
<text x="492" y="404" font-size="12.5" fill="#334155">same condition, different</text>
<text x="492" y="422" font-size="12.5" fill="#334155">thresholds across documents</text>
<text x="492" y="440" font-size="12.5" fill="#334155">→ suggestion from dates</text>
<line x1="218" y1="122" x2="248" y2="122" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="218" y1="160" x2="248" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="218" y1="400" x2="248" y2="410" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="354" y1="352" x2="354" y2="332" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="354" y1="184" x2="354" y2="204" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="458" y1="268" x2="476" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="582" y1="184" x2="582" y2="204" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="582" y1="330" x2="582" y2="350" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="730" y="60" width="200" height="150" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="744" y="89" font-size="15" font-weight="700" fill="#0f172a">Draft</text>
<text x="744" y="112" font-size="12.5" fill="#334155">review.md   for people</text>
<text x="744" y="130" font-size="12.5" fill="#334155">draft.json  for programs</text>
<text x="744" y="148" font-size="12.5" fill="#334155">status · quote · errors</text>
<text x="744" y="166" font-size="12.5" fill="#334155">per item</text>
<rect x="730" y="250" width="200" height="124" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="744" y="279" font-size="15" font-weight="700" fill="#0f172a">Human approval</text>
<text x="744" y="302" font-size="12.5" fill="#334155">resolve every conflict:</text>
<text x="744" y="320" font-size="12.5" fill="#334155">keep one or schedule</text>
<text x="744" y="338" font-size="12.5" fill="#334155">drop / include items</text>
<line x1="686" y1="390" x2="728" y2="190" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="830" y1="210" x2="830" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="730" y="414" width="200" height="96" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="744" y="443" font-size="15" font-weight="700" fill="#0f172a">approval.log</text>
<text x="744" y="466" font-size="12.5" fill="#334155">what was kept, dropped,</text>
<text x="744" y="484" font-size="12.5" fill="#334155">scheduled and applied</text>
<line x1="830" y1="374" x2="830" y2="412" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="960" y="60" width="192" height="150" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="974" y="89" font-size="15" font-weight="700" fill="#0f172a">Approved ontology</text>
<text x="974" y="112" font-size="12.5" fill="#334155">ontology.yaml</text>
<text x="974" y="130" font-size="12.5" fill="#334155">seed.json</text>
<text x="974" y="148" font-size="12.5" fill="#334155">facts applied to records</text>
<rect x="960" y="250" width="192" height="124" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="974" y="279" font-size="15" font-weight="700" fill="#0f172a">nano-onto</text>
<text x="974" y="302" font-size="12.5" fill="#334155">rules enforced by code,</text>
<text x="974" y="320" font-size="12.5" fill="#334155">approvals, audit log</text>
<text x="974" y="338" font-size="12.5" fill="#334155">MCP · CLI · HTTP</text>
<rect x="960" y="414" width="192" height="96" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="974" y="443" font-size="15" font-weight="700" fill="#0f172a">Agents</text>
<text x="974" y="466" font-size="12.5" fill="#334155">act through typed,</text>
<text x="974" y="484" font-size="12.5" fill="#334155">rule-checked actions</text>
<line x1="930" y1="300" x2="958" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="1056" y1="210" x2="1056" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="1056" y1="374" x2="1056" y2="412" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="250" y="519" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="531" font-size="12" fill="#334155">checked by code</text>
<rect x="390" y="519" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="410" y="531" font-size="12" fill="#334155">written by a model, then checked</text>
</svg>
